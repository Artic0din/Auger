name: Secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        # The base commit's .gitleaks.toml applies, so a pull request cannot allowlist its own leak.
        run: |
          base="${RANGE%%..*}"
          case "$base" in 0000000000000000000000000000000000000000) RANGE="${RANGE#*..}~1..${RANGE#*..}" ;; esac
          git show "$base:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml" 2>/dev/null || cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" git --log-opts="$RANGE" --config "$RUNNER_TEMP/gitleaks.toml" --redact --no-banner --exit-code 1
