# Groups the notes from GitHub's "Generate release notes" button by pull
# request labels. Automated releases write their notes with
# scripts/generate-changelog.py instead. See docs/releasing.md.
changelog:
  categories:
    - title: 🚀 Features
      labels: [enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📚 Documentation
      labels: [documentation]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
