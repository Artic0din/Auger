blank_issues_enabled: false
contact_links:
  - name: Problem with the Silo server or web app
    url: https://github.com/Silo-Server/silo-server/issues/new/choose
    about: Report it in the upstream silo-server repository, especially if it also happens in the web app.
  - name: Problem in Silo's iOS, tvOS, or macOS app
    url: https://github.com/Silo-Server/silo-apple/issues/new/choose
    about: Report it in the upstream silo-apple repository.
  - name: Problem in Silo's Android phone or TV app
    url: https://github.com/Silo-Server/silo-android/issues/new/choose
    about: Report it in the upstream silo-android repository.
  - name: Report a security vulnerability
    url: https://github.com/Artic0din/Auger-Tizen/security/advisories/new
    about: Report it privately. Do not open a public issue.
