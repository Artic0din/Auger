name: Release

# Releases main after Tizen Builds passes on it. scripts/release-version.py
# picks vX.Y.Z from the Conventional Commits since the latest published release
# (or skips the release when none needs one), and this workflow signs Auger.wgt
# with the Tizen SDK public distributor certificate (no personal TV DUIDs),
# reserves the tag, publishes it on a GitHub Release with notes from
# scripts/generate-changelog.py, and opens a pull request to record the notes
# in CHANGELOG.md. Run it by hand to force a bump or a version. See docs/releasing.md.

on:
  workflow_run:
    workflows: ["Tizen Builds"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "auto = from Conventional Commits since the latest tag. patch, minor or major = force that bump."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: "Optional explicit X.Y.Z version override (for example 1.0.0)"
        required: false
        type: string

# One release at a time, so each run sees the tag the previous one created.
# Non-qualifying workflow_run completions (such as failed builds) use their own
# group so they never displace a queued green release.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'release' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Choose the version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # check Tizen Builds on the commit
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      bump: ${{ steps.version.outputs.bump }}
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - name: Resolve the commit to release
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Releases are made from main."
              exit 1
            fi
            echo "target_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "target_sha=${RUN_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0 # all tags and the commits since the latest one
          persist-credentials: false

      - name: Require Tizen Builds to have passed on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          conclusion="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow tizen-build.yml \
            --branch main --commit "${TARGET_SHA}" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::Tizen Builds has not passed on ${TARGET_SHA::9} (${conclusion:-still running or missing}). Release once it is green."
            exit 1
          fi

      - name: Choose the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          # A tag without a published release was left by an unfinished run, so
          # only published releases count as released.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft == false) | .tag_name' > "${RUNNER_TEMP}/published-tags.txt"
          python3 scripts/release-version.py next --bump "${BUMP}" --version "${VERSION}" --target "${TARGET_SHA}" \
            --published-tags-file "${RUNNER_TEMP}/published-tags.txt" | tee -a "${GITHUB_OUTPUT}"

      - name: Summarize
        env:
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          BUMP: ${{ steps.version.outputs.bump }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          if [[ "${SHOULD_RELEASE}" == "true" ]]; then
            echo "Releasing **${TAG}** (${BUMP} bump since ${PREVIOUS_TAG:-the first commit}) from ${TARGET_SHA::9}." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No release for ${TARGET_SHA::9}: it is already released, or no commit since ${PREVIOUS_TAG:-the first commit} is a feat, fix, perf, revert or breaking change." >> "${GITHUB_STEP_SUMMARY}"
          fi

  wgt:
    name: Build the signed .wgt
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: npm ci

      - name: Install the Tizen CLI
        run: scripts/ci/install-tizen-cli.sh

      - name: Create the signing profile
        id: signing
        run: scripts/ci/create-signing-profile.sh

      - name: Require the public Tizen certificate
        if: steps.signing.outputs.signing != 'public'
        run: |
          echo "::error::Public Tizen signing profile was not created; refusing to publish."
          exit 1

      - name: Set the version
        run: scripts/ci/set-wgt-version.sh "${VERSION}"

      - name: Package and sign
        run: |
          scripts/build-wgt.sh
          mkdir wgt
          cp dist/Auger.wgt wgt/Auger.wgt
          (cd wgt && sha256sum Auger.wgt > Auger.wgt.sha256 && cat Auger.wgt.sha256)

      - name: Show the Tizen CLI log
        if: failure()
        run: find "${HOME}" -path '*cli/logs/cli.log' -exec tail -n 60 {} \;

      - name: Upload the .wgt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: auger-release-wgt
          path: |
            wgt/Auger.wgt
            wgt/Auger.wgt.sha256
          if-no-files-found: error

      - name: Remove the signing certificates
        if: always()
        run: rm -rf "${RUNNER_TEMP}/tizen-signing" "${HOME}"/tizen-*data/profile "${HOME}"/tizen-*data/keystore

  publish:
    name: Publish the GitHub Release
    needs: [prepare, wgt]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and release
    outputs:
      release_date: ${{ steps.notes.outputs.release_date }}
      previous_sha: ${{ steps.notes.outputs.previous_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0 # the commits since the previous tag, for the notes
          persist-credentials: false

      - name: Download the .wgt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: auger-release-wgt
          path: ${{ runner.temp }}/wgt

      - name: Verify the checksum
        run: (cd "${RUNNER_TEMP}/wgt" && sha256sum --check Auger.wgt.sha256)

      - name: Write the release notes
        id: notes
        run: |
          release_date="$(date -u +%Y-%m-%d)"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            body_date="$(gh release view "${TAG}" --json isDraft,body \
              --jq 'if .isDraft then "" else ((.body // "") | capture("^# Updates - Auger v[^ ]+ \\((?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})\\)")? .d // "") end')"
            if [[ "${body_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              release_date="${body_date}"
            else
              published_at="$(gh release view "${TAG}" --json isDraft,publishedAt --jq 'if .isDraft then "" else (.publishedAt // "") end')"
              if [[ "${published_at}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2} ]]; then
                release_date="${BASH_REMATCH[0]}"
              fi
            fi
          fi
          echo "release_date=${release_date}" >> "${GITHUB_OUTPUT}"
          previous_sha=""
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            previous_sha="$(git rev-parse --verify "${PREVIOUS_TAG}^{commit}")"
          fi
          echo "previous_sha=${previous_sha}" >> "${GITHUB_OUTPUT}"
          {
            python3 scripts/generate-changelog.py release --version "${VERSION}" --date "${release_date}" \
              ${previous_sha:+--from "${previous_sha}"} --to "${TARGET_SHA}"
            echo
            echo "## Install"
            echo
            echo "- **Apps2Samsung (recommended):** add \`github.com/${GH_REPO}\` as a source, then install or update Auger from it. Apps2Samsung re-signs \`Auger.wgt\` with your own Samsung certificate."
            echo "- **Sideload with Tizen Studio:** public releases use the Tizen SDK public certificate (no personal TV DUIDs), so direct \`tizen install\` requires building and signing locally with your own Samsung certificate (\`./scripts/build-wgt.sh\`)."
            if [[ "${PREVIOUS_TAG}" == *-beta.* ]]; then
              echo "- **Upgrading from \`0.1.0-beta.*\`:** uninstall the older build first, because the Tizen package ID changed to \`AugerTv001.Auger\`. Uninstalling clears saved sign-in data, so you sign in again once; subsequent \`AugerTv001.Auger\` releases update in place within the same install method."
            fi
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the release
        env:
          WGT: ${{ runner.temp }}/wgt
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          # Check an existing release first so an already-published retry does
          # not fail on extra API calls.
          release_state="missing"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" == "false" ]]; then
              tag_sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
              if [[ "${tag_sha}" == "${TARGET_SHA}" ]]; then
                echo "${TAG} is already published for ${TARGET_SHA::9}."
                exit 0
              fi
              echo "::error::${TAG} is already published for ${tag_sha::9}, not ${TARGET_SHA::9}. Run Release on main so it plans the next version."
              exit 1
            fi
            release_state="draft"
          fi

          # Reserve the tag on TARGET_SHA before any release exists. Creating
          # the ref is atomic, so two runs can never publish one tag for two
          # commits. A 422 means the ref exists, which is fine only when it
          # already points at TARGET_SHA (a retry, or a run that stopped after
          # reserving it; release-version.py plans that as bump=recover).
          ref_status=0
          ref_resp="$(gh api -i "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${TARGET_SHA}" 2>&1)" || ref_status=$?
          ref_http="$(printf '%s\n' "${ref_resp}" | sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' | head -n 1)"
          if [[ "${ref_status}" -eq 0 ]]; then
            echo "Reserved ${TAG} on ${TARGET_SHA::9}."
          elif [[ "${ref_http}" != "422" ]]; then
            echo "::error::Could not reserve tag ${TAG} (HTTP ${ref_http:-unknown}). Re-run failed jobs."
            exit 1
          fi
          tag_sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
          if [[ "${tag_sha}" != "${TARGET_SHA}" ]]; then
            echo "::error::Tag ${TAG} points to ${tag_sha::9}, not ${TARGET_SHA::9}. Run Release on main so it plans the next version."
            exit 1
          fi

          # Never roll Latest backward if a newer stable release published
          # before a retry of this job ran.
          published_tags="$(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          latest_flag="$(python3 - "${TAG}" "${published_tags}" <<'PY'
          import re, sys

          def parse(tag: str):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(int(part) for part in match.groups()) if match else None

          current = parse(sys.argv[1])
          has_newer = current is not None and any(
              version > current
              for line in sys.argv[2].splitlines()
              if (version := parse(line.strip())) is not None
          )
          print("--latest=false" if has_newer else "--latest")
          PY
          )"

          # "Re-run failed jobs" re-runs this whole job. For a leftover draft,
          # replace both assets from this run's verified bundle and update
          # notes so a retry never mixes artifacts across commits.
          if [[ "${release_state}" == "draft" ]]; then
            gh release upload "${TAG}" --clobber "${WGT}/Auger.wgt" "${WGT}/Auger.wgt.sha256"
            gh release edit "${TAG}" --title "Auger ${VERSION}" \
              --notes-file "${NOTES}" --draft=false --prerelease=false "${latest_flag}"
            echo "${TAG} is published with its .wgt."
            exit 0
          fi

          # --verify-tag publishes on the reserved tag and never creates or moves one.
          gh release create "${TAG}" --verify-tag "${latest_flag}" \
            --title "Auger ${VERSION}" --notes-file "${NOTES}" "${WGT}/Auger.wgt" "${WGT}/Auger.wgt.sha256"

  changelog:
    name: Open CHANGELOG.md pull request
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the changelog branch
      pull-requests: write # open the CHANGELOG.md pull request
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_SHA: ${{ needs.publish.outputs.previous_sha }}
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      RELEASE_DATE: ${{ needs.publish.outputs.release_date }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0 # commit history for generate-changelog.py
          persist-credentials: false

      - name: Open a pull request to record the release in CHANGELOG.md
        run: |
          # Separate job so a transient PR failure can be retried with "Re-run failed jobs"
          # after the GitHub Release is already live.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git_auth() { git -c "http.https://github.com/.extraheader=${auth_header}" "$@"; }
          branch="docs/changelog-v${VERSION}"
          generator="${RUNNER_TEMP}/changelog-generator"
          mkdir -p "${generator}"
          cp scripts/generate-changelog.py scripts/release-version.py "${generator}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing="$(gh pr list --repo "${GH_REPO}" --head "${branch}" --state open --json number --jq '.[0].number // ""')"
          if [[ -n "${existing}" ]]; then
            echo "Changelog PR #${existing} is already open for ${TAG}; leaving it untouched."
            exit 0
          fi
          git_auth fetch --quiet origin main
          if git grep -qE "^## \[${VERSION//./\\.}\]" origin/main -- CHANGELOG.md 2>/dev/null; then
            echo "CHANGELOG.md on main already records ${VERSION}."
            exit 0
          fi
          if git_auth fetch --quiet origin "${branch}" 2>/dev/null; then
            git checkout --quiet -B "${branch}" "origin/${branch}"
          else
            git checkout --quiet -B "${branch}" origin/main
          fi
          python3 "${generator}/generate-changelog.py" update --file CHANGELOG.md --version "${VERSION}" \
            --date "${RELEASE_DATE}" ${PREVIOUS_SHA:+--from "${PREVIOUS_SHA}"} --to "${TARGET_SHA}"
          if ! git diff --quiet CHANGELOG.md; then
            git commit --quiet -m "docs(changelog): record v${VERSION} release notes" CHANGELOG.md
            git_auth push origin "HEAD:${branch}"
          elif git merge-base --is-ancestor "${branch}" origin/main; then
            echo "CHANGELOG.md on main already records ${VERSION}."
            exit 0
          fi
          pr_body="$(printf 'Adds the release notes for %s to CHANGELOG.md.\n\n## Evidence\n\nEvidence: none, no user-visible change\n\n## ELI5\n\nAdds the generated release notes for %s to the changelog file.\n' "${TAG}" "${TAG}")"
          gh pr create --repo "${GH_REPO}" --base main --head "${branch}" \
            --title "docs(changelog): record v${VERSION} release notes" \
            --body "${pr_body}"
