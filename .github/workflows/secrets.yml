name: Secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        # The base commit's gitleaks rules apply, so a pull request cannot allowlist its own leak.
        run: |
          base="${RANGE%%..*}"
          head="${RANGE#*..}"
          # Without a usable base commit, scan the head's whole history rather than guess a range.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$head"; RANGE="$head"; fi
          # A base without .gitleaks.toml gets gitleaks' default rules, never the scanned commits' own.
          config=()
          if git show "$base:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml" 2>/dev/null; then config=(--config "$RUNNER_TEMP/gitleaks.toml"); fi
          # Use the base commit's .gitleaksignore and honour no inline gitleaks:allow, so the scanned commits cannot exempt themselves.
          git show "$base:.gitleaksignore" > .gitleaksignore 2>/dev/null || rm -f .gitleaksignore
          # remerge shows what a merge commit's conflict resolution added, which plain git log -p omits.
          "$RUNNER_TEMP/gitleaks" git --log-opts="$RANGE --diff-merges=remerge" "${config[@]}" \
            --ignore-gitleaks-allow --redact --no-banner --exit-code 1
