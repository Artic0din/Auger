name: Feature request
description: Suggest an improvement to Auger (Samsung TV / Tizen)
title: "[feature] "
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        A request is most useful when it explains the problem you hit, with a concrete example, rather than prescribing a solution. One request per issue.

        Auger implements features that Silo's `/api/v2` API supports. Requests that need new server behavior belong in the upstream [silo-server](https://github.com/Silo-Server/silo-server/issues/new/choose) repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today. Give a concrete example.
    validations:
      required: true
  - type: dropdown
    id: device-type
    attributes:
      label: Device
      multiple: true
      options:
        - "Samsung TV"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: current-workaround
    attributes:
      label: Current workaround
      description: What you do instead today, or "none".
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: What you would like the app to do. Describe the outcome, not an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including other apps, and why they fall short.
  - type: dropdown
    id: ai-involvement
    attributes:
      label: AI involvement
      options:
        - No AI used
        - Human-written, AI-reviewed
        - AI-assisted
        - Fully AI-generated, human verified
    validations:
      required: true
  - type: input
    id: ai-harness
    attributes:
      label: AI harness
      description: Optional. If you used AI, enter the agent harness or app.
  - type: input
    id: ai-tools
    attributes:
      label: AI tool(s)
      description: Optional. If you used AI, enter the tool name(s).
  - type: input
    id: ai-models
    attributes:
      label: AI model(s)
      description: Optional. If you used AI, enter the model identifier(s).
  - type: textarea
    id: ai-review
    attributes:
      label: Independent or adversarial review
      description: Optional. If applicable, summarize any independent review.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched open and closed issues, including ones closed as not planned, and this is not already requested
          required: true
        - label: This works with what Silo's server already supports, or I filed the server part in silo-server
          required: true
