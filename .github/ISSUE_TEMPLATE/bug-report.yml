name: Bug report
description: Report something broken in Auger (Samsung TV / Tizen)
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Report behavior you reproduced yourself. Keep what you observed separate from any theory about the cause. Redact credentials, tokens, personal data, server addresses, and private media details, and mark each redaction.

        Not sure where to find your TV version, Auger version, or the player's **Stats** tab? See the [Bug Reporting Guide](https://github.com/Artic0din/Auger-Tizen/blob/main/docs/reporting-bugs.md).

        Problems that also happen in the web app usually come from the server and belong in the upstream [silo-server](https://github.com/Silo-Server/silo-server/issues/new/choose). Problems in Silo's Apple apps belong in [silo-apple](https://github.com/Silo-Server/silo-apple/issues/new/choose), and problems in Silo's Android apps belong in [silo-android](https://github.com/Silo-Server/silo-android/issues/new/choose).

        Fabricated or AI-hallucinated reports are an immediate block. Read [CONTRIBUTING.md](https://github.com/Artic0din/Auger-Tizen/blob/main/CONTRIBUTING.md) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you actually observe? Include how often it happens (for example "3 of 3 attempts") and what still works, such as the same item in the web app.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps you ran, from a stated starting point.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should have happened, and where that expectation comes from.
    validations:
      required: true
  - type: dropdown
    id: device-type
    attributes:
      label: Device
      multiple: true
      options:
        - "Samsung TV"
        - "Other"
    validations:
      required: true
  - type: input
    id: device-details
    attributes:
      label: TV model
      description: Find the **Model Code** under **TV Settings > Support > About This TV**.
      placeholder: UE50CU7095
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: Find the **Software Version** under **TV Settings > Support > About This TV**.
      placeholder: "1650"
    validations:
      required: true
  - type: input
    id: tizen-version
    attributes:
      label: Tizen version
      description: Enter your Tizen version if you know it.
      placeholder: Tizen 8.0
  - type: input
    id: app-version
    attributes:
      label: Auger version
      description: "Open your **Profile** icon (top-right) > **Settings** (shown at the bottom of the left sidebar, or under **Server > About > App Version**)."
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installed from
      options:
        - "Apps2Samsung (official catalog)"
        - ".wgt from GitHub Releases"
        - "Built from source"
        - "Other"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Silo server version
      description: In Auger, open **Profile > Settings > Diagnostics** and look for **Silo Server** under **Device**. Leave this field blank if the version is unavailable.
  - type: textarea
    id: playback-details
    attributes:
      label: Playback details
      description: "For playback problems: while playing, wait until the playback controls are hidden, press **Down** on the Samsung remote to open the options panel on **Video**, then move one tab toward **Info** (**Left** in left-to-right layouts) to open **Stats** (or press **Up** > **Down** > **Options** > **Stats**). Include **Playback**, **Video**, **Dynamic range**, **Audio**, **Subtitles**, **Diagnostics**, and **Delivery**, plus your audio setup (TV speakers, soundbar, or receiver). A phone photo of the **Stats** tab below also works."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots, phone photos, or recording
      description: Optional. Drag files here (a phone photo of the player **Stats** tab or error screen is fine). Crop or blur server addresses, account names, and anything else private first.
  - type: textarea
    id: relevant-logs
    attributes:
      label: Relevant server logs
      description: Optional. Raw lines from the server's **Admin > Logs**, filtered by playback session when you can.
      render: shell
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical notes
      description: Optional suspected root cause or related observations. Keep this separate from what you observed above.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched open and recently closed issues and pull requests, and this is not already reported
          required: true
        - label: I reproduced this myself on the device and app version above
          required: true
