name: Release

# Releases main after Tizen Builds passes on it. scripts/release-version.py
# picks vX.Y.Z from the Conventional Commits since the latest tag (or skips the
# release when none needs one), and this workflow signs Auger.wgt with the
# maintainer's Samsung certificate and publishes it on a GitHub Release that
# creates the tag. Run it by hand to force a bump or a version. See
# docs/releasing.md.

on:
  workflow_run:
    workflows: ["Tizen Builds"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "auto = from Conventional Commits since the latest tag. patch, minor or major = force that bump."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: "Optional explicit X.Y.Z version override (for example 1.0.0)"
        required: false
        type: string

# One release at a time, so each run sees the tag the previous one created.
# Non-qualifying workflow_run completions (such as failed builds) use their own
# group so they never displace a queued green release.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'release' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Choose the version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # check Tizen Builds on the commit
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      bump: ${{ steps.version.outputs.bump }}
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - name: Resolve the commit to release
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Releases are made from main."
              exit 1
            fi
            echo "target_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "target_sha=${RUN_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0 # all tags and the commits since the latest one
          persist-credentials: false

      - name: Require Tizen Builds to have passed on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          conclusion="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow tizen-build.yml \
            --branch main --commit "${TARGET_SHA}" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::Tizen Builds has not passed on ${TARGET_SHA::9} (${conclusion:-still running or missing}). Release once it is green."
            exit 1
          fi

      - name: Choose the version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          python3 scripts/release-version.py next --bump "${BUMP}" --version "${VERSION}" --target "${TARGET_SHA}" |
            tee -a "${GITHUB_OUTPUT}"

      - name: Summarize
        env:
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          BUMP: ${{ steps.version.outputs.bump }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          if [[ "${SHOULD_RELEASE}" == "true" ]]; then
            echo "Releasing **${TAG}** (${BUMP} bump since ${PREVIOUS_TAG:-the first commit}) from ${TARGET_SHA::9}." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No release for ${TARGET_SHA::9}: it is already released, or no commit since ${PREVIOUS_TAG:-the first commit} is a feat, fix, perf, revert or breaking change." >> "${GITHUB_STEP_SUMMARY}"
          fi

  wgt:
    name: Build the signed .wgt
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - run: npm ci

      - name: Install the Tizen CLI
        run: scripts/ci/install-tizen-cli.sh

      - name: Create the signing profile
        id: signing
        run: scripts/ci/create-signing-profile.sh
        env:
          TIZEN_AUTHOR_P12_B64: ${{ secrets.TIZEN_AUTHOR_P12_B64 }}
          TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          TIZEN_DISTRIBUTOR_P12_B64: ${{ secrets.TIZEN_DISTRIBUTOR_P12_B64 }}
          TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}

      - name: Require the Samsung certificate
        if: steps.signing.outputs.signing != 'samsung'
        run: |
          echo "::error::The TIZEN_* signing secrets are missing, so this build would not install on a TV."
          exit 1

      - name: Set the version
        run: scripts/ci/set-wgt-version.sh "${VERSION}"

      - name: Package and sign
        run: |
          scripts/build-wgt.sh
          mkdir wgt
          cp dist/Auger.wgt wgt/Auger.wgt
          (cd wgt && sha256sum Auger.wgt > Auger.wgt.sha256 && cat Auger.wgt.sha256)

      - name: Show the Tizen CLI log
        if: failure()
        run: find "${HOME}" -path '*cli/logs/cli.log' -exec tail -n 60 {} \;

      - name: Upload the .wgt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: auger-release-wgt
          path: |
            wgt/Auger.wgt
            wgt/Auger.wgt.sha256
          if-no-files-found: error

      - name: Remove the signing certificates
        if: always()
        run: rm -rf "${RUNNER_TEMP}/tizen-signing" "${HOME}"/tizen-*data/profile "${HOME}"/tizen-*data/keystore

  publish:
    name: Publish the GitHub Release
    needs: [prepare, wgt]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and its tag
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Download the .wgt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: auger-release-wgt
          path: wgt

      - name: Verify the checksum
        run: (cd wgt && sha256sum --check Auger.wgt.sha256)

      - name: Publish the release
        run: |
          # If the tag already exists in git, verify it points to TARGET_SHA
          # before touching any release (GitHub ignores --target when the tag
          # already exists). Continue only on a confirmed 404 or verified match.
          tag_status=0
          tag_resp="$(gh api -i "repos/${GH_REPO}/git/ref/tags/${TAG}" 2>&1)" || tag_status=$?
          tag_http="$(printf '%s\n' "${tag_resp}" | sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p')"
          if [[ "${tag_status}" -eq 0 ]]; then
            tag_sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
            if [[ "${tag_sha}" != "${TARGET_SHA}" ]]; then
              echo "::error::Tag ${TAG} already points to ${tag_sha::9}, not ${TARGET_SHA::9}. Run Release on main so it plans the next version."
              exit 1
            fi
          elif [[ "${tag_http}" != "404" ]]; then
            echo "::error::Could not verify tag ${TAG} (HTTP ${tag_http:-unknown}). Re-run failed jobs."
            exit 1
          fi

          # Check an existing release first so an already-published retry does
          # not fail on extra API calls.
          release_state="missing"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" == "false" ]]; then
              tag_sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
              if [[ "${tag_sha}" == "${TARGET_SHA}" ]]; then
                echo "${TAG} is already published for ${TARGET_SHA::9}."
                exit 0
              fi
              echo "::error::${TAG} is already published for ${tag_sha::9}, not ${TARGET_SHA::9}. Run Release on main so it plans the next version."
              exit 1
            fi
            release_state="draft"
          fi

          # Never roll Latest backward if a newer stable release published
          # before a retry of this job ran.
          published_tags="$(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          latest_flag="$(python3 - "${TAG}" "${published_tags}" <<'PY'
          import re, sys

          def parse(tag: str):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(int(part) for part in match.groups()) if match else None

          current = parse(sys.argv[1])
          has_newer = current is not None and any(
              version > current
              for line in sys.argv[2].splitlines()
              if (version := parse(line.strip())) is not None
          )
          print("--latest=false" if has_newer else "--latest")
          PY
          )"

          {
            gh api "repos/${GH_REPO}/releases/generate-notes" \
              -f tag_name="${TAG}" -f target_commitish="${TARGET_SHA}" \
              ${PREVIOUS_TAG:+-f previous_tag_name="${PREVIOUS_TAG}"} --jq .body
            echo
            echo "### Install"
            echo
            echo "- **Apps2Samsung:** add \`github.com/${GH_REPO}\` as a source, then install or update Auger from it."
            echo "- **Sideload:** download \`Auger.wgt\` and \`Auger.wgt.sha256\`, check it with \`sha256sum --check Auger.wgt.sha256\`, and run \`tizen install -n Auger.wgt -t <device>\` on a TV in Developer Mode. It installs only on TVs listed in the maintainer's signing certificate."
          } > notes.md

          # "Re-run failed jobs" re-runs this whole job. For a leftover draft,
          # replace both assets from this run's verified bundle and update
          # target and notes so a retry never mixes artifacts across commits.
          if [[ "${release_state}" == "draft" ]]; then
            gh release upload "${TAG}" --clobber wgt/Auger.wgt wgt/Auger.wgt.sha256
            gh release edit "${TAG}" --target "${TARGET_SHA}" --title "Auger ${VERSION}" \
              --notes-file notes.md --draft=false --prerelease=false "${latest_flag}"
            echo "${TAG} is published with its .wgt."
            exit 0
          fi

          # The release creates the tag on the target commit, so a failed run never leaves a tag behind.
          gh release create "${TAG}" --target "${TARGET_SHA}" "${latest_flag}" \
            --title "Auger ${VERSION}" --notes-file notes.md wgt/Auger.wgt wgt/Auger.wgt.sha256
