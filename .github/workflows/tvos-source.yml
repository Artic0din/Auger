name: tvOS source

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: tvos-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos-source:
    name: tvOS source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tvOS source an interface change ports
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        # Runs the base branch's copy, so a pull request cannot weaken the check it is judged by.
        run: |
          git show "$BASE:scripts/ci/check-tvos-source.py" > "$RUNNER_TEMP/check-tvos-source.py" 2>/dev/null \
            || cp scripts/ci/check-tvos-source.py "$RUNNER_TEMP/check-tvos-source.py"
          python3 -I "$RUNNER_TEMP/check-tvos-source.py"
