name: Bug report
description: Report something broken in Auger (Samsung TV / Tizen)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report behavior you reproduced yourself. Keep what you observed separate from any theory about the cause. Redact credentials, tokens, personal data, server addresses, and private media details, and mark each redaction.

        Not sure where to find your TV version, Auger version, or the player's **Stats** tab? See the [Bug Reporting Guide](https://github.com/Artic0din/Auger-Tizen/blob/main/docs/reporting-bugs.md).

        Problems that also happen in the web app usually come from the server and belong in the upstream [silo-server](https://github.com/Silo-Server/silo-server/issues/new/choose). Problems in Silo's Apple apps belong in [silo-apple](https://github.com/Silo-Server/silo-apple/issues/new/choose), and problems in Silo's Android apps belong in [silo-android](https://github.com/Silo-Server/silo-android/issues/new/choose).

        Fabricated or AI-hallucinated reports are an immediate block. Read [CONTRIBUTING.md](https://github.com/Artic0din/Auger-Tizen/blob/main/CONTRIBUTING.md) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you actually observe? Include how often it happens (for example "3 of 3 attempts") and what still works, such as the same item in the web app.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps you ran, from a stated starting point.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should have happened, and where that expectation comes from.
    validations:
      required: true
  - type: dropdown
    id: device-type
    attributes:
      label: Device
      multiple: true
      options:
        - "Samsung TV"
        - "Other"
    validations:
      required: true
  - type: input
    id: device-details
    attributes:
      label: TV model, firmware, and Tizen version
      description: "On your Samsung TV: **TV Settings > Support > About This TV** (Model Code and Software Version, plus Tizen version if known)."
      placeholder: Samsung CU7095 (UE50CU7095), Firmware 1650, Tizen 8.0
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Auger version
      description: "Open your **Profile** icon (top-right) > **Settings** (shown at the bottom of the left sidebar, or under **Server > About > App Version**)."
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installed from
      options:
        - "Apps2Samsung (official catalog)"
        - "Apps2Samsung (custom GitHub source)"
        - ".wgt from GitHub Releases"
        - "Built from source"
        - "Other"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Silo server version
      description: The **Build** value at the bottom of the server's **Admin** sidebar, for example `412 · 1a2b3c4d`. Ask your server admin if that is not you.
    validations:
      required: true
  - type: textarea
    id: playback-details
    attributes:
      label: Playback details
      description: "For playback problems: while playing, press **Down** on the Samsung remote to open the options panel, then press **Left** twice to open **Stats** (or press **Up** > **Down** > **Options** > **Stats**). Include **Playback**, **Video**, **Dynamic range**, **Audio**, **Subtitles**, **Diagnostics**, and **Delivery**, plus your audio setup (TV speakers, soundbar, or receiver). A phone photo of the **Stats** tab below also works."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots, phone photos, or recording
      description: Optional. Drag files here (a phone photo of the player **Stats** tab or error screen is fine). Crop or blur server addresses, account names, and anything else private first.
  - type: textarea
    id: relevant-logs
    attributes:
      label: Relevant server logs
      description: Optional. Raw lines from the server's **Admin > Logs**, filtered by playback session when you can.
      render: shell
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical notes
      description: Optional suspected root cause or related observations. Keep this separate from what you observed above.
  - type: dropdown
    id: ai-involvement
    attributes:
      label: AI involvement
      options:
        - No AI used
        - Human-written, AI-reviewed
        - AI-assisted
        - Fully AI-generated, human verified
    validations:
      required: true
  - type: input
    id: ai-harness
    attributes:
      label: AI harness
      description: Optional. If you used AI, enter the agent harness or app.
  - type: input
    id: ai-tools
    attributes:
      label: AI tool(s)
      description: Optional. If you used AI, enter the tool name(s).
  - type: input
    id: ai-models
    attributes:
      label: AI model(s)
      description: Optional. If you used AI, enter the model identifier(s).
  - type: textarea
    id: ai-review
    attributes:
      label: Independent or adversarial review
      description: Optional. If applicable, summarize any independent review.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched open and recently closed issues and pull requests, and this is not already reported
          required: true
        - label: I reproduced this myself on the device and app version above
          required: true
