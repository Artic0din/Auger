name: Deploy diagnostics Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/diagnostics-relay/**'
      - '!workers/diagnostics-relay/**/*.md'
      - '!workers/diagnostics-relay/**/*.d.ts'
      - '.github/workflows/deploy-diagnostics-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auger-diagnostics-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Build the latest main even if queued runs start out of order.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Check for Worker source
        id: source
        shell: bash
        run: |
          if [[ ! -d workers/diagnostics-relay ]]; then
            echo '::notice::Waiting for the diagnostics relay source to land on main.'
            exit 0
          fi
          test -f workers/diagnostics-relay/worker.js
          test -f workers/diagnostics-relay/wrangler.toml
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.source.outputs.ready == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Deploy to Cloudflare
        if: steps.source.outputs.ready == 'true'
        working-directory: workers/diagnostics-relay
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable and CLOUDFLARE_API_TOKEN repository secret.'
            exit 1
          fi
          # GITHUB_TOKEN is an existing Worker secret, not a GitHub Actions input.
          npx --yes wrangler@4.168.0 deploy
